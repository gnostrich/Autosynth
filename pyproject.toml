[project]
name = "ets"
version = "0.0.0"
description = "Equilibrium Tape Synth — engine"
requires-python = ">=3.10"
# Runtime deps are added as the features that need them land (build order 5b+).
# No web/browser stack is permitted in the runtime (spec I-13).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# sounddevice: desktop audio-out for the panel/engine deployment (and the
# tools/audio_check.py preflight). Deliberately NOT a core dependency — the
# build/CI box is headless and the base package must not require PortAudio.
panel = ["PySide6-Essentials>=6.6", "python-osc>=1.8", "sounddevice>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
