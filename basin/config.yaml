# The Basin — v0.1 configuration.
# Every value here is a [default] from the build spec: build as stated,
# cheap to change. Scripts load this and pass it down through the pipeline.

# --- windowing / features (M1) ---
stems: none         # none | hpss (2 imposed layers) | nmf (emergent channels, K measured)
n_channels: auto    # nmf only: 'auto' = held-out elbow, or an int
sr: 22050           # load mono at this rate
hop: 1024           # frame hop (~46 ms per frame)
window_s: 1.5       # window length (atomic corpus unit)
overlap: 0.5        # window overlap fraction

# --- atlas (M1) ---
pca_dims: 40        # PCA-whitened feature dimensionality
n_charts: 256       # k-means charts
top_memberships: 8  # soft-assignment neighbours kept per window

# --- spectrum / basins (M1) ---
n_macros: auto      # 'auto' = spectral-gap detection, else an int
n_basins: auto      # 'auto' = silhouette over [4, 10], else an int

# --- kernel (M3) ---
prony_order: 2      # damped-oscillator modes to fit (spec allows <=3)

# --- orbit (M2/M3) ---
beta: 1.0           # knob-bias lean strength (grip)
gamma: 0.3          # wanderlust (recent-visitation repulsion)
tau: 1.0            # temperature (drift): low = mode-following, high = diffuse
kappa: 0.3          # memory-term strength (kappa=0 reproduces M2; >~0.7 over-sticks)

# --- render (M2) ---
crossfade_s: 0.375  # equal-power crossfade (half a hop)
step_s: 0.75        # orbit step / grain emission rate
beta_read: 1.0      # flow mode: strength of the walk's field on the grain read
couple: 0.5         # multi-voice: pull of each voice toward the others' territory
momentum: 0.0       # momentum-orbit strength (0 = off; oscillator params from kernel fit)
