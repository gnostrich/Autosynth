<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Basin — Panel</title>
<style>
  :root { --bg:#0e0f13; --panel:#171922; --ink:#e7e9f0; --dim:#8890a6;
          --accent:#6fd3c7; --warn:#e0a458; --grip:#e06565; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.4 ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid #23262f;
           display:flex; align-items:center; gap:14px; }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.03em; }
  #status { font-size:12px; color:var(--dim); }
  #audiobtn { margin-left:auto; background:var(--accent); color:#08211e;
              border:0; padding:7px 14px; border-radius:6px; cursor:pointer;
              font-weight:600; }
  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
         gap:16px; padding:20px; }
  section.group { grid-column:1/-1; margin:6px 0 -6px; color:var(--dim);
                  font-size:12px; text-transform:uppercase; letter-spacing:.12em; }
  .cell { background:var(--panel); border:1px solid #23262f; border-radius:10px;
          padding:14px; display:flex; flex-direction:column; align-items:center; }
  .cell canvas { touch-action:none; cursor:grab; }
  .cell .name { margin-top:8px; font-size:13px; font-weight:600; cursor:text; }
  .cell .sub { font-size:11px; color:var(--dim); }
  .toggle { width:54px; height:30px; border-radius:16px; background:#2a2d38;
            position:relative; cursor:pointer; transition:background .2s; }
  .toggle.on { background:var(--accent); }
  .toggle .dot { position:absolute; top:3px; left:3px; width:24px; height:24px;
                 border-radius:50%; background:#e7e9f0; transition:left .2s; }
  .toggle.on .dot { left:27px; }
  .meta input { width:120px; }
  .hint { padding:0 20px 24px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>The Basin</h1>
  <span id="status">connecting…</span>
  <button id="audiobtn">enable audio</button>
</header>
<main id="panel"></main>
<p class="hint">lean = drag needle · grip = click-hold (no drag) clamps the coordinate ·
   phase dial drag = nudge · double-click a name to rename.</p>
<script>
const TAU = Math.PI * 2;
let ws, audioCtx = null, playHead = 0;
const panel = document.getElementById('panel');
const statusEl = document.getElementById('status');

// ---- Web Audio: schedule int16 PCM chunks ----
document.getElementById('audiobtn').onclick = () => {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  playHead = audioCtx.currentTime + 0.2;
  document.getElementById('audiobtn').textContent = 'audio on';
};
function playPCM(int16, sr) {
  if (!audioCtx) return;
  const f = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) f[i] = int16[i] / 32768;
  const buf = audioCtx.createBuffer(1, f.length, sr);
  buf.copyToChannel(f, 0);
  const src = audioCtx.createBufferSource();
  src.buffer = buf; src.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  if (playHead < now) playHead = now + 0.1;
  src.start(playHead);
  playHead += buf.duration;
}

// ---- control channel ----
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

// ---- rendering primitives ----
function knobCanvas(cell, opts) {
  const c = document.createElement('canvas');
  c.width = 140; c.height = 140; cell.appendChild(c);
  return { canvas: c, ctx: c.getContext('2d'), ...opts };
}
function drawMacro(k, st) {
  const g = k.ctx, R = 54, cx = 70, cy = 70;
  g.clearRect(0, 0, 140, 140);
  // absolute collar (thin arc, true position at true rate)
  const ap = Math.max(-3, Math.min(3, st.position)) / 3;   // clamp to ±3σ
  g.beginPath(); g.arc(cx, cy, R + 8, -TAU/4, -TAU/4 + (ap+1)/2*TAU);
  g.strokeStyle = '#3a4050'; g.lineWidth = 3; g.stroke();
  // bounded knob body
  g.beginPath(); g.arc(cx, cy, R, 0, TAU);
  g.fillStyle = st.gripped ? '#2c1f22' : '#20232e';
  g.fill(); g.strokeStyle = st.gripped ? 'var(--grip)' : '#39405a';
  g.lineWidth = 2; g.stroke();
  // co-moving needle: the innovation (motion beyond PULL+kernel prediction)
  const inn = Math.max(-1, Math.min(1, st.innovation * 4));
  const ang = -TAU/4 + inn * TAU/3;
  g.beginPath(); g.moveTo(cx, cy);
  g.lineTo(cx + R*0.8*Math.cos(ang), cy + R*0.8*Math.sin(ang));
  g.strokeStyle = st.gripped ? '#e06565' : '#6fd3c7';
  g.lineWidth = 3; g.stroke();
  g.beginPath(); g.arc(cx, cy, 4, 0, TAU); g.fillStyle = '#e7e9f0'; g.fill();
}
function drawGroove(k, st) {
  const g = k.ctx, R = 50, cx = 70, cy = 70;
  g.clearRect(0, 0, 140, 140);
  // endless phase dial
  g.beginPath(); g.arc(cx, cy, R, 0, TAU);
  g.strokeStyle = '#39405a'; g.lineWidth = 2; g.stroke();
  // depth ring
  const d = Math.min(1, st.depth * 3);
  g.beginPath(); g.arc(cx, cy, R - 8, 0, d * TAU);
  g.strokeStyle = 'var(--warn)'; g.lineWidth = 4; g.stroke();
  // phase needle
  const a = st.phase;
  g.beginPath(); g.moveTo(cx, cy);
  g.lineTo(cx + R*0.8*Math.cos(a), cy + R*0.8*Math.sin(a));
  g.strokeStyle = '#6fd3c7'; g.lineWidth = 3; g.stroke();
  g.beginPath(); g.arc(cx, cy, 4, 0, TAU); g.fillStyle = '#e7e9f0'; g.fill();
}

// ---- build panel skeleton once, from the first state message ----
let built = false, macroK = [], grooveK = [];
function build(state) {
  panel.innerHTML = '';
  macroK = []; grooveK = [];
  addGroup('macros');
  state.macros.forEach((m, i) => {
    const cell = mkCell();
    const k = knobCanvas(cell, { i });
    macroK.push(k);
    wireMacro(k, cell, m, i);
    addName(cell, m.name, 'macro:' + m.index);
    addSub(cell, 'linear · bounded');
    panel.appendChild(cell);
  });
  if (state.grooves.length) addGroup('groove');
  state.grooves.forEach((gr, i) => {
    const cell = mkCell();
    const k = knobCanvas(cell, { i, mode: gr.index });
    grooveK.push(k);
    wireGroove(k, cell, gr);
    addName(cell, gr.name, 'groove:' + gr.index);
    addSub(cell, 'oscillatory · phase+depth');
    panel.appendChild(cell);
  });
  if (state.toggles.length) addGroup('alternation');
  state.toggles.forEach(t => {
    const cell = mkCell();
    const tg = document.createElement('div'); tg.className = 'toggle';
    tg.innerHTML = '<div class="dot"></div>'; tg.dataset.mode = t.index;
    cell.appendChild(tg);
    addName(cell, t.name, 'alt:' + t.index);
    addSub(cell, 'alternation · toggle');
    panel.appendChild(cell);
  });
  addGroup('meta');
  ['beta','gamma','tau','kappa','momentum'].forEach(name => {
    const cell = mkCell(); cell.classList.add('meta');
    const label = {beta:'grip β', gamma:'wanderlust γ', tau:'temperature τ',
                   kappa:'memory κ', momentum:'momentum β_p'}[name];
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = 0; inp.max = name==='tau'?3:2;
    inp.step = 0.05; inp.value = state.meta[name];
    inp.oninput = () => send({type:'meta', name, value:+inp.value});
    cell.appendChild(inp); addName(cell, label, null); panel.appendChild(cell);
  });
  built = true;
}
function mkCell(){ const d=document.createElement('div'); d.className='cell'; return d; }
function addGroup(t){ const s=document.createElement('section');
  s.className='group'; s.textContent=t; panel.appendChild(s); }
function addName(cell, text, key){
  const n=document.createElement('div'); n.className='name'; n.textContent=text;
  if(key) n.ondblclick=()=>{ const v=prompt('Rename', text);
    if(v){ n.textContent=v; send({type:'rename', key, name:v}); } };
  cell.appendChild(n);
}
function addSub(cell,t){ const s=document.createElement('div');
  s.className='sub'; s.textContent=t; cell.appendChild(s); }

// ---- gestures ----
function wireMacro(k, cell, m, idx){
  let down=false, dragged=false, sx=0;
  k.canvas.onpointerdown=e=>{ down=true; dragged=false; sx=e.clientX;
    k.canvas.setPointerCapture(e.pointerId); };
  k.canvas.onpointermove=e=>{ if(!down) return;
    const dx=e.clientX-sx; if(Math.abs(dx)>3){ dragged=true;
      send({type:'lean', macro:idx, delta:dx*0.01}); sx=e.clientX; } };
  k.canvas.onpointerup=()=>{ if(down && !dragged){        // click-hold = grip
      const on=!cell.classList.toggle('gripped')?false:true;
      send({type:'grip', macro:idx, on, value:k.lastPos||0}); }
    down=false; };
}
function wireGroove(k, cell, gr){
  let down=false, sa=0;
  k.canvas.onpointerdown=e=>{ down=true; sa=e.clientX;
    k.canvas.setPointerCapture(e.pointerId); };
  k.canvas.onpointermove=e=>{ if(!down) return;
    const dx=e.clientX-sa; send({type:'nudge', mode:gr.index, delta:dx*0.02});
    sa=e.clientX; };
  k.canvas.onpointerup=()=>down=false;
}

// ---- state stream ----
function connect(){
  ws = new WebSocket(`ws://${location.host}/`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => statusEl.textContent = 'orbiting';
  ws.onclose = () => { statusEl.textContent = 'disconnected'; setTimeout(connect,1500); };
  ws.onmessage = ev => {
    if (typeof ev.data === 'string') {
      const st = JSON.parse(ev.data);
      if (st.type !== 'state') return;
      if (!built) build(st);
      st.macros.forEach((m,i)=>{ if(macroK[i]){ macroK[i].lastPos=m.position;
        drawMacro(macroK[i], m); } });
      st.grooves.forEach((g,i)=>{ if(grooveK[i]) drawGroove(grooveK[i], g); });
      document.querySelectorAll('.toggle').forEach(tg=>{
        const t = st.toggles.find(x=>x.index==tg.dataset.mode);
        if(t) tg.classList.toggle('on', t.on); });
    } else {
      playPCM(new Int16Array(ev.data), 22050);
    }
  };
}
connect();
</script>
</body>
</html>
